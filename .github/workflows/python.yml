name: Python optical lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tools -v
      - run: python tools/optical_lab.py simulate --trials 30 --output simulation-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: optical-simulation
          path: simulation-results.json
